xclusivos\n- Pagamento: 12x cartao + Pix com 12-15% off + boleto\n- Funil: order bump R$ 297 + upsell premium R$ 997-1.997\n\n**PREMIUM (R$ 5k-20k)**:\n- Core: mentoria premium / mastermind / done-for-you\n- Bonus: acesso exclusivo + networking + suporte 1-a-1 + lives mensais\n- Garantia: condicional 60-90d com criterios (Risk Reversal Jay Abraham)\n- Ancoragem: ROI esperado em multiplos do investimento (\"ROI 10x em 12 meses\")\n- Urgencia: vagas limitadas (10-30 pessoas) + processo de aplicacao\n- Pagamento: customizado + boleto + Pix com 15-20% off + cartao 12x\n\n**ULTRA-HIGH (R$ 20k+) — Aplicacao + Call**:\n- Core: mastermind / consultoria customizada / done-for-you\n- Bonus: minimos mas alto valor (1-2 bonus exclusivos)\n- Garantia: ROI condicional (\"se nao gerar X em Y meses, devolvo Z\" — Inversao Risco Abraham)\n- Ancoragem: business outcome (revenue / lucro / saving)\n- Urgencia: aplicacao + qualificacao + agenda do expert (real)\n- Pagamento: custom (split, boleto parcelado, sinal + parcelas, payment plan)\n\n### 4. Entregavel obrigatorio (voce NUNCA termina sem)\n\n**a) Core offer** com nome, transformacao quantificada (Hormozi specificity), descricao pronta para PV (3-5 paragrafos), valor atribuido, mecanismo unico nominal.\n\n**b) Bonus stack completo** — para cada bonus:\n- Nome especifico atraente (NAO \"Bonus 1\")\n- Valor percebido individual (R$)\n- Objecao que resolve (uma especifica — Brunson regra 6)\n- Descricao pronta para PV (template \"Com [nome do bonus] voce vai...\")\n- Para qual perfil e perfeito\n- Tipo (entrega rapida / alto valor / acesso / template / comunidade)\n\n**c) Garantia** — tipo escolhido por faixa de ticket (incondicional / condicional / dupla / trial / risk reversal Abraham), prazo, texto completo pronto para PV com selo visual.\n\n**d) Ancoragem de preco** — 4 tecnicas aplicadas com texto pronto:\n- Valor total vs preco lancamento (Anchoring Tversky)\n- Comparacao com alternativa (consultor / faculdade / curso premium)\